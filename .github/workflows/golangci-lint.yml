name: 'golangci-lint'
on:
  push:
    branches:
    - 'master'
  pull_request:

permissions:
  contents: 'read'
  pull-requests: 'read'

jobs:
  golangci:
    name: 'lint'
    runs-on: 'ubuntu-24.04'
    steps:
      - uses: 'actions/checkout@v5'
      - uses: 'actions/setup-go@v6'
        with:
          cache: false
          go-version: '1.25.4'
      - name: 'golangci-lint'
        uses: 'golangci/golangci-lint-action@v9'
        with:
          version: 'latest'
          args: '--timeout=60m'
          skip-cache: true
