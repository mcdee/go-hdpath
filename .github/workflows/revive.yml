name: 'revive'
on:
  push:
    branches:
    - 'master'
  pull_request:

permissions:
  contents: read

jobs:
  revive:
    runs-on: 'ubuntu-24.04'
    steps:
      - uses: 'actions/setup-go@v6'
        with:
          cache: false
          go-version: '1.25.4'
      - uses: 'actions/checkout@v5'
      - uses: 'morphy2k/revive-action@v2'
